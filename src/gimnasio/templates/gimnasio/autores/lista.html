{% extends "library/base.html" %}
{% block content %}<h1>Autores</h1><a class="button" href="{% url 'crear_autor' %}">Nuevo autor</a><br><br><table><tr><th>Nombre</th><th>Nacionalidad</th><th>Acciones</th></tr>{% for autor in autores %}<tr><td>{{ autor }}</td><td>{{ autor.nacionalidad }}</td><td class="actions"><a href="{% url 'editar_autor' autor.id %}">Editar</a><a href="{% url 'eliminar_autor' autor.id %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="3">No hay autores registrados.</td></tr>{% endfor %}</table>{% endblock %}
