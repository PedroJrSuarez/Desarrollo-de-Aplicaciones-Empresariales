{% extends "library/base.html" %}
{% block content %}<h1>Categorías</h1><a class="button" href="{% url 'crear_categoria' %}">Nueva categoría</a><br><br><table><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr>{% for categoria in categorias %}<tr><td>{{ categoria.nombre }}</td><td>{{ categoria.descripcion }}</td><td class="actions"><a href="{% url 'editar_categoria' categoria.id %}">Editar</a><a href="{% url 'eliminar_categoria' categoria.id %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="3">No hay categorías registradas.</td></tr>{% endfor %}</table>{% endblock %}
