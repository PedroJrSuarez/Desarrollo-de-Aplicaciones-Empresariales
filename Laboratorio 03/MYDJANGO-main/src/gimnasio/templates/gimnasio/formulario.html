{% extends "gimnasio/base.html" %}
{% block title %}{{ titulo }} | Gimnasio{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<form method="post" class="panel">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Guardar</button>
    <a class="button secondary" href="{% url 'inicio' %}">Cancelar</a>
</form>
{% endblock %}
