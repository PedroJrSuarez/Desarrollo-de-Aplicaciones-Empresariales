{% extends "library/base.html" %}
{% block content %}<h1>Usuarios</h1><a class="button" href="{% url 'crear_usuario' %}">Nuevo usuario</a><br><br><table><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>{% for usuario in usuarios %}<tr><td>{{ usuario }}</td><td>{{ usuario.correo }}</td><td>{{ usuario.telefono }}</td><td class="actions"><a href="{% url 'editar_usuario' usuario.id %}">Editar</a><a href="{% url 'eliminar_usuario' usuario.id %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="4">No hay usuarios registrados.</td></tr>{% endfor %}</table>{% endblock %}
